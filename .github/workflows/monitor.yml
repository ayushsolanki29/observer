name: Observer Monitor

on:
  schedule:
    - cron: "0 */6 * * *" # Every 6 hours
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: observer-monitor
  cancel-in-progress: false

jobs:
  monitor:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Run Observer
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: npm start

      - name: Commit storage changes
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"

          if [ -f data/storage.json ]; then
            git add -f data/storage.json
            if ! git diff --cached --quiet; then
              git commit -m "chore(observer): update storage"
              git push
            else
              echo "No storage changes."
            fi
          else
            echo "storage.json not found. Skipping."
          fi